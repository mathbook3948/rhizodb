name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  tag:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      name: ${{ steps.name.outputs.name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78
      - name: Name the tag of the crate version
        id: name
        shell: bash
        run: |
          crate="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "rhizodb") | .version')"
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            if [ "$GITHUB_REF" != "refs/heads/main" ]; then
              echo "a release can be dispatched only from main" >&2
              exit 1
            fi
            name="v$crate"
            if git fetch --quiet origin "refs/tags/$name:refs/tags/$name" 2>/dev/null; then
              if [ "$(git rev-parse "$name^{commit}")" != "$GITHUB_SHA" ]; then
                echo "tag $name already names another commit" >&2
                exit 1
              fi
            fi
          else
            name="$GITHUB_REF_NAME"
            if [ "${name#v}" != "$crate" ]; then
              echo "tag $name does not match crate version $crate" >&2
              exit 1
            fi
          fi
          echo "name=$name" >> "$GITHUB_OUTPUT"
      - name: Check that the commit is on main
        shell: bash
        run: |
          git fetch origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "commit $GITHUB_SHA is not on main" >&2
            exit 1
          fi
      - name: Extract the release notes
        shell: bash
        env:
          TAG: ${{ steps.name.outputs.name }}
        run: |
          version="${TAG#v}"
          awk -v heading="## $version" '
            $0 == heading { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > notes.md
          if ! grep -q '[^[:space:]]' notes.md; then
            echo "CHANGELOG.md has no notes under ## $version" >&2
            exit 1
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: notes
          path: notes.md

  check:
    needs: tag
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78
      - run: mise run check

  randomized:
    needs: tag
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78
      - run: mise run random
        env:
          RHIZODB_TEST_SCALE: "3"

  package:
    needs: tag
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install the Rust toolchain that mise.toml pins
        shell: bash
        run: |
          toolchain="$(sed -n 's/^rust = { version = "\([^"]*\)".*/\1/p' mise.toml)"
          if [ -z "$toolchain" ]; then
            echo "mise.toml pins no Rust version" >&2
            exit 1
          fi
          rustup toolchain install "$toolchain" --profile minimal
          rustup default "$toolchain"
      - name: Package the crate and build it from its packaged files
        shell: bash
        run: cargo package --package rhizodb --locked

  publish:
    needs: [tag, check, randomized, package]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install the Rust toolchain that mise.toml pins
        shell: bash
        run: |
          toolchain="$(sed -n 's/^rust = { version = "\([^"]*\)".*/\1/p' mise.toml)"
          if [ -z "$toolchain" ]; then
            echo "mise.toml pins no Rust version" >&2
            exit 1
          fi
          rustup toolchain install "$toolchain" --profile minimal
          rustup default "$toolchain"
      - name: Check whether this version is already on crates.io
        id: published
        shell: bash
        env:
          TAG: ${{ needs.tag.outputs.name }}
        run: |
          version="${TAG#v}"
          status="$(curl --silent --output /dev/null --write-out '%{http_code}' \
            --user-agent "rhizodb-release (${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY})" \
            "https://crates.io/api/v1/crates/rhizodb/${version}")"
          if [ "$status" = "200" ]; then
            echo "rhizodb ${version} is already on crates.io"
            echo "done=true" >> "$GITHUB_OUTPUT"
          else
            echo "done=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Publish the package the package job verified
        if: steps.published.outputs.done == 'false'
        shell: bash
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish --package rhizodb --locked --no-verify

  github-release:
    needs: [tag, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: notes
      - name: Create the GitHub release unless it exists
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.tag.outputs.name }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "release $TAG already exists"
          else
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" \
              --title "$TAG" --notes-file notes.md --target "$GITHUB_SHA"
          fi
