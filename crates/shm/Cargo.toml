[package]
name = "rhizodb-shm"
description = "Shared mappings seen as atomic words, byte-range locks, and reserved file growth, for RhizoDB's multi-process sessions"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
include = ["src/**/*", "LICENSE-*", "Cargo.toml"]

[lints]
workspace = true

[dependencies]
memmap2 = "0.9.12"

[target.'cfg(unix)'.dependencies]
libc = "0.2.191"

[target.'cfg(any(target_os = "linux", target_os = "android", target_vendor = "apple"))'.dependencies]
rustix = { version = "1.1.6", default-features = false, features = ["std", "fs"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_IO"] }

[dev-dependencies]
tempfile = "3.27.0"
