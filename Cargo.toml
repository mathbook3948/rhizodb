[workspace]
resolver = "3"
members = ["crates/*"]
exclude = ["crates/differential", "crates/bench"]

[workspace.package]
version = "0.2.1"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/mathbook3948/rhizodb"
rust-version = "1.100"

[workspace.lints.clippy]
allow_attributes_without_reason = "deny"

[workspace.lints.rust]
missing_debug_implementations = "warn"
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(fuzzing)"] }

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
