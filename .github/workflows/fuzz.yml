name: fuzz

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: fuzz-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fuzz:
    name: ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        target: [parse, value_decode, graph_ops, db_file, engine_formats, engine_file]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - run: cargo install cargo-fuzz --version 0.13.2 --locked
      - run: sh fuzz/run.sh 60 "$TARGET"
        env:
          TARGET: ${{ matrix.target }}
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-artifacts-${{ matrix.target }}
          path: fuzz/artifacts
