[package]
name = "rhizodb"
description = "An embedded, schemaless property graph database for Rust, queried with GQL"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
readme = "README.md"
documentation = "https://docs.rs/rhizodb"
keywords = ["graph", "database", "gql", "cypher", "embedded"]
categories = ["database-implementations", "database"]
include = ["src/**/*", "examples/**/*", "LICENSE-*", "README.md", "Cargo.toml"]

[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu"]

[lints]
workspace = true

[dev-dependencies]
proptest = "1.12.0"
tempfile = "3.27.0"

[dependencies]
crc32fast = "1.5.5"
twox-hash = { version = "2.1.5", default-features = false, features = ["std", "xxhash3_64"] }
jiff = { version = "0.2.38", default-features = false, features = ["std", "tzdb-bundle-always"] }
memchr = "2.8.3"
regex-automata = "0.4.18"
regex-syntax = "0.8.11"
unicode-normalization = "0.1.26"
unicode-segmentation = "1.13.3"

[target.'cfg(any(target_os = "linux", target_os = "android", target_vendor = "apple"))'.dependencies]
rustix = { version = "1.1.6", default-features = false, features = ["std", "fs"] }
