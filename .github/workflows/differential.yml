name: differential

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: differential-${{ github.ref }}
  cancel-in-progress: true

env:
  MISE_TASK_RUN_AUTO_INSTALL: "false"

jobs:
  ladybug:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          workspaces: crates/differential
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: crates/bench/.lbug-extensions
          key: lbug-extensions-${{ hashFiles('crates/bench/Cargo.toml', 'crates/bench/scripts/lbug-extensions.sh') }}
      - run: mise run differential
      - run: mise run bench-test
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/crates/differential/target
