[tools]
rust = { version = "1.100.0", components = "rustfmt,clippy" }
ast-grep = "0.51.3"
cargo-deny = "0.22.0"

[hooks]
postinstall = "git config core.hooksPath .githooks"

[tasks.check-fast]
description = "Format and guard checks that finish in seconds, run by the pre-commit hook"
run = [
  "cargo fmt --all --check",
  "cargo fmt --manifest-path crates/differential/Cargo.toml --check",
  "ast-grep scan --no-ignore hidden",
  "ast-grep test --skip-snapshot-tests",
  "cargo run --quiet --package xtask -- forbidden-chars",
  "cargo run --quiet --package xtask -- docs",
  "cargo run --quiet --package xtask -- hooks",
  "cargo run --quiet --package xtask -- readme",
  "cargo run --quiet --package xtask -- scaled",
  "cargo deny check licenses bans sources",
  "cargo deny --manifest-path crates/differential/Cargo.toml check licenses bans sources",
  "cargo fmt --manifest-path crates/bench/Cargo.toml --check",
  "cargo deny --manifest-path crates/bench/Cargo.toml check licenses bans sources",
]

[tasks.check]
description = "Fast checks first, then lint, the tests that are not marked ignored, the doctests, and the examples, as every pull request runs"
depends = ["check-fast"]
run = [
  "cargo clippy --workspace --all-targets -- -D warnings",
  "cargo clippy --package rhizodb --target-dir target/fuzzing --config \"build.rustflags = ['--cfg', 'fuzzing']\" -- -D warnings",
  "cargo rustdoc --package rhizodb -- -D warnings",
  "cargo test --workspace",
  "cargo run --quiet --package rhizodb --example social",
  "cargo run --quiet --package rhizodb --example search",
  "cargo run --quiet --package rhizodb --example procedures",
]

[tasks.random]
description = "Run the tests that check leaves out, which are marked ignored: the randomized, crash at every point, kill, stress, timing, and heap growth tests, at the case counts CI runs, as every push to main does"
run = "cargo test --workspace --exclude tck --no-fail-fast -- --ignored --skip engine::bench_tests::"

[tasks.storage-deep]
description = "Run the storage, engine, database crash, dump, node meta, property column, adjacency, relationship chunk, graph decoder fuzz, query parameter fuzz, index key, scan, relationship scan, row stream, and replication simulation tests with 100 times the random cases that random runs, as the nightly workflow does"
env = { RHIZODB_TEST_SCALE = "100" }
run = "cargo test --release --package rhizodb --lib -- storage:: engine:: database:: dump:: graph::meta graph::node_meta graph::columns graph::adjacency graph::relationships graph::upgrade graph::fuzz query::fuzz query::keys query::scan query::relationship_scan query::stream replication:: --include-ignored --skip engine::bench_tests::"

[tasks.random-deep]
description = "Run the randomized integration tests (isolation history check, kill-and-reopen, replicas killed during apply, model of random transactions, damaged files, concurrent writers and readers, large transactions, killed backups, query reference evaluator, heap growth, snapshots held across checkpoints, threads racing to create one file, random reads on one thread and on four, shuttle schedules) with 100 times the cases that random runs, then every integration test with each read query that can split forced across four threads"
env = { RHIZODB_TEST_SCALE = "{{ get_env(name='RHIZODB_TEST_SCALE', default='100') }}" }
run = [
  "cargo test --release --package rhizodb --test isolation --test kill_recovery --test replication_kill --test model_ops --test corrupt_file --test concurrency --test resource_limits --test backup --test query_oracle --test memory_growth --test snapshot_stress --test api_misuse --test parallel_reads -- --include-ignored",
  "cargo test --release --package interleavings -- --include-ignored",
  { task = "parallel-deep" },
]

[tasks.parallel-deep]
description = "Run every integration test with each read query that can split forced across four threads"
env = { RHIZODB_TEST_PARALLEL = "1", RHIZODB_TEST_SCALE = "1" }
run = "cargo test --release --package rhizodb --tests -- --include-ignored --skip engine::bench_tests::"

[tasks.soak]
description = "Kill a writing child process at random points for RHIZODB_SOAK_SECS seconds (default 3600), and check every reopened file against what the child reported"
run = "RHIZODB_SOAK_SECS=${RHIZODB_SOAK_SECS:-3600} cargo test --release --package rhizodb --test soak -- --nocapture"

[tasks.fuzz]
description = "Fuzz every target for the given seconds each (default 300), and fail on any panic that escapes RhizoDB, hang, or out-of-memory, for example: mise run fuzz 600"
run = "sh fuzz/run.sh"

[tasks.differential]
description = "Compare query results with LadybugDB, which builds from C++ source"
dir = "crates/differential"
run = [
  "cargo clippy --all-targets -- -D warnings",
  "cargo test",
]

[tasks.docs]
description = "Regenerate the docs index"
run = "cargo run --quiet --package xtask -- docs-write"

[tasks.lbug-extensions]
description = "Build the LadybugDB FTS and VECTOR extensions from the source of the pinned release"
run = "bash crates/bench/scripts/lbug-extensions.sh"

[tasks.bench-test]
description = "Run every benchmark workload at tiny scale on the embedded engines built by default, which builds LadybugDB from C++ source"
depends = ["lbug-extensions"]
dir = "crates/bench"
run = [
  "cargo clippy --all-targets -- -D warnings",
  "cargo test",
]

[tasks.bench-test-all]
description = "Run bench-test with DuckDB and CozoDB, whose C++ builds are long"
depends = ["lbug-extensions"]
dir = "crates/bench"
run = [
  "cargo clippy --all-targets --features duckdb,cozo -- -D warnings",
  "cargo test --features duckdb,cozo",
]

[tasks.bench]
description = "Measure every engine, for example: mise run bench --scale small --reps 5 --out result.json --neo4j bolt://127.0.0.1:7687"
depends = ["lbug-extensions"]
dir = "crates/bench"
run = "cargo run --release --features duckdb,cozo --"

[tasks.size-report]
description = "Load the benchmark graph into RhizoDB at a scale (default medium) and report where the bytes of its file go, by table, page fill, and property key, for example: mise run size-report small"
run = "bash crates/bench/scripts/size-report.sh"

[tasks.bench-readme]
description = "Measure RhizoDB and LadybugDB at medium scale with 5 repetitions and rewrite the benchmark tables in README.md and README.ko.md, or set BENCH_README_REPORT to a saved JSON report to only rewrite the table"
depends = ["lbug-extensions"]
run = "bash crates/bench/scripts/readme-table.sh"
