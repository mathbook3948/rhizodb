id: checkout-without-persisted-credentials
language: yaml
severity: error
message: "A checkout step sets `persist-credentials: false`, so later steps cannot read the token."
files:
  - .github/workflows/*.yml
rule:
  kind: block_mapping
  has:
    kind: block_mapping_pair
    all:
      - has:
          field: key
          regex: ^uses$
      - has:
          field: value
          regex: ^actions/checkout@
  not:
    has:
      kind: block_mapping_pair
      regex: persist-credentials:\s*false
---
id: action-pinned-by-sha
language: yaml
severity: error
message: Each `uses:` names an action at a full 40-character commit SHA, never at a tag or branch that can move, or a workflow of this repository.
files:
  - .github/workflows/*.yml
rule:
  kind: block_mapping_pair
  all:
    - has:
        field: key
        regex: ^uses$
    - has:
        field: value
        not:
          regex: ^([A-Za-z0-9_.-]+/[A-Za-z0-9_./-]+@[0-9a-f]{40}|\./\.github/workflows/[A-Za-z0-9_.-]+\.ya?ml)$
