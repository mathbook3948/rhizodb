name: differential

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: differential-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ladybug:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: jdx/mise-action@v5
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/differential
      - uses: actions/cache@v4
        with:
          path: crates/bench/.lbug-extensions
          key: lbug-extensions-${{ hashFiles('crates/bench/Cargo.toml', 'crates/bench/scripts/lbug-extensions.sh') }}
      - run: mise run differential
      - run: mise run bench-test
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/crates/differential/target
