[graph]
all-features = true

[licenses]
allow = [
  "MIT",
  "Apache-2.0",
  "Unicode-3.0",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "CC0-1.0",
  "CDLA-Permissive-2.0",
  "BSL-1.0",
  "Apache-2.0 WITH LLVM-exception",
]
confidence-threshold = 0.9
exceptions = [
  { name = "foldhash", allow = ["Zlib"] },
  { name = "cozo", allow = ["MPL-2.0"] },
  { name = "cozorocks", allow = ["MPL-2.0"] },
  { name = "smartstring", allow = ["MPL-2.0"] },
  { name = "priority-queue", allow = ["MPL-2.0"] },
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
